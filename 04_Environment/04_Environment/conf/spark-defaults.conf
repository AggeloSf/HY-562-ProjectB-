# HY562 lab image - Spark defaults (read from $SPARK_CONF_DIR)
spark.master                      local[*]
spark.driver.memory               2g
spark.sql.shuffle.partitions      8
spark.ui.port                     4040
spark.sql.adaptive.enabled        true
# Kafka source/sink for Structured Streaming (Lab 3). Scala 2.13 build, same version as Spark.
spark.jars.packages               org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
