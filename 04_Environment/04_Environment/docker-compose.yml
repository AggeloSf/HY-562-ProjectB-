# HY562 / CS-562 Fall 2026 - lab environment
#   docker compose up -d --build      # first time (builds the image, ~5-10 min)
#   docker compose up -d              # afterwards
#   docker compose logs spark-lab     # shows the JupyterLab URL
#   docker compose down               # stop everything (your files in ../ are kept)
#
# This copy is nested two levels below the project root, which is mounted as /home/jovyan/work.

name: hy562

services:
  spark-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: hy562/spark-lab:2026
    container_name: hy562-spark-lab
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark UI of the first SparkSession (4041, 4042 ... for further ones)
      - "4041:4041"
    environment:
      JUPYTER_TOKEN: "hy562"
      KAFKA_BOOTSTRAP: "kafka:9092"
      DBPEDIA_ENDPOINT: "oxigraph:data/kg/dbpedia2022/store"
      DBPEDIA_KG: "dbpedia2022"
      DBLP_ENDPOINT: "oxigraph:data/kg/dblp2022/store"
      OLLAMA_HOST: "http://host.docker.internal:11435"
    volumes:
      - ../../:/home/jovyan/work
    depends_on:
      - kafka
    restart: unless-stopped

  kafka:
    # Official Apache Kafka image, single-node KRaft (broker + controller, no ZooKeeper)
    image: apache/kafka:4.3.1
    container_name: hy562-kafka
    ports:
      - "29092:29092" # access from the host machine (localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # containers on the compose network use kafka:9092 ; the host uses localhost:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    # one-shot: creates the topic used in Lab 3, then exits
    image: apache/kafka:4.3.1
    container_name: hy562-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic retail-events --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic retail-events"
    restart: "no"
